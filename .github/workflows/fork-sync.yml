name: Fork Sync

# 同步策略（2026-10-28 起改为合并模式）：
# 原镜像模式（reset --hard + force push）会把 main 上的本地提交
# （如 v2rayn:// 解析修复）在每次运行时静默丢弃，导致 Pages 回滚。
# 现改为 merge 合并上游，本地提交始终保留；
# 若合并产生冲突则中止并保持 main 不变，需手动处理后重跑。

on:
  schedule:
    - cron: "0 22 * * *"     # 每天北京时间 06:00 执行
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream (merge)
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git and remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main || git checkout -b main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/imzyb/MiSub.git
          else
            git remote add upstream https://github.com/imzyb/MiSub.git
          fi

          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
            echo "✅ 检测到 SYNC_PAT，将使用 PAT 推送（支持同步 .github/workflows）。"
          else
            echo "⚠️ 未配置 SYNC_PAT，将使用默认 GITHUB_TOKEN。"
          fi

          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Merge upstream main (保留本地提交)
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          if [ "${ORIGIN_SHA}" = "${UPSTREAM_SHA}" ]; then
            echo "✨ Fork 已与上游完全一致，无需同步。"
            exit 0
          fi

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" "${ORIGIN_SHA}"; then
            echo "✨ 上游已包含于本地 main，本地更新更多，无需同步。"
            exit 0
          fi

          echo "🔁 开始合并上游 main（本地提交保留）..."
          if git merge upstream/main --no-edit; then
            git push origin main
            echo "✅ 已合并并推送上游更新，本地提交均已保留。Cloudflare Pages 将自动重新构建。"
          else
            git merge --abort || true
            echo "::error title=合并冲突::合并上游 imzyb/MiSub 时产生冲突，已中止，本地 main 保持不变。请手动合并解决冲突后推送。"
            exit 1
          fi
